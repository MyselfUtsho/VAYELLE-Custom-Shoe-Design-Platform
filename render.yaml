services:
  - type: web
    name: vayelle-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_NAME
        value: vayelle_db
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
