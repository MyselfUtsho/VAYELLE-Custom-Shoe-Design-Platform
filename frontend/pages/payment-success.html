<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment Success — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content">
    <div class="payment-result fade-up">
      <div class="result-icon success">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1>Order Placed Successfully!</h1>
      <p>Thank you for your order. This is a demonstration — no real payment was processed.</p>
      <div class="panel" style="text-align:left;margin-bottom:24px;" id="order-details"></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="order-history.html" class="btn btn-primary">View Order History</a>
        <a href="explore.html" class="btn btn-outline">Continue Shopping</a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/data.js"></script><script src="../js/store.js"></script><script src="../js/colors.js"></script><script src="../js/main.js"></script>
  <script>
    const orders = getState().orders;
    const lastOrder = orders.length > 0 ? orders[0] : null;
    if (lastOrder) {
      const shoe = lastOrder.shoeId ? getShoe(lastOrder.shoeId) : null;
      document.getElementById('order-details').innerHTML = `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);"><span style="color:var(--text-muted);">Order ID</span><span style="font-weight:600;">${lastOrder.id}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);"><span style="color:var(--text-muted);">Date</span><span>${formatDate(lastOrder.date)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);"><span style="color:var(--text-muted);">Shoe</span><span>${shoe ? shoe.name : '—'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="color:var(--text-muted);">Total</span><span style="font-weight:700;color:var(--accent);">${bdt(lastOrder.total)}</span></div>`;
    }
  </script>
</body>
</html>
