<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Showcase — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content">
    <div class="section-container">
      <div class="page-header" style="padding:0 0 24px;">
        <p class="eyebrow">Community</p>
        <h1>Design Showcase & Remix</h1>
        <p>Explore public creations from the VAYELLE community, like your favorites, or remix them into your own style.</p>
      </div>

      <!-- Controls -->
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:28px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="chip active" id="filter-all-btn" onclick="filterCommunity('all', this)">All Designs</button>
          <button class="chip" id="filter-popular-btn" onclick="filterCommunity('popular', this)">Most Liked</button>
          <button class="chip" id="filter-my-btn" onclick="filterCommunity('liked', this)">My Liked</button>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <input type="text" class="form-input" id="comm-search" placeholder="Search creators or design..." oninput="searchCommunity(this.value)" style="width:240px;padding:8px 14px;">
          <a href="studio.html" class="btn btn-accent btn-sm">+ Share New Design</a>
        </div>
      </div>

      <!-- Showcase Grid -->
      <div class="gallery-grid" id="community-grid"></div>

      <!-- Empty State -->
      <div class="empty-state" id="comm-empty" style="display:none;">
        <div style="font-size:3rem;margin-bottom:12px;">👟</div>
        <h3>No community designs match your query</h3>
        <p>Try clearing filters or search terms.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let currentFilter = 'all';
    let searchQuery = '';

    function filterCommunity(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderCommunity();
    }

    function searchCommunity(val) {
      searchQuery = val.toLowerCase().trim();
      renderCommunity();
    }

    function renderCommunity() {
      const likesList = getState().likes;
      let list = [...communityDesigns];

      if (searchQuery) {
        list = list.filter(d => d.name.toLowerCase().includes(searchQuery) || d.creator.toLowerCase().includes(searchQuery));
      }

      if (currentFilter === 'popular') {
        list.sort((a, b) => (b.likes + (likesList.includes(b.id) ? 1 : 0)) - (a.likes + (likesList.includes(a.id) ? 1 : 0)));
      } else if (currentFilter === 'liked') {
        list = list.filter(d => likesList.includes(d.id));
      }

      const grid = document.getElementById('community-grid');
      const empty = document.getElementById('comm-empty');

      if (list.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      grid.innerHTML = list.map(d => {
        const isUserLiked = likesList.includes(d.id);
        const totalLikes = d.likes + (isUserLiked ? 1 : 0);
        const shoeObj = getShoe(d.shoe);
        const decosData = (d.decos || []).map((id, idx) => ({ uid: 'c_' + idx, id: id, x: 50, y: 40, scale: 1 }));

        return `
          <div class="community-card">
            <div class="community-card-preview" onclick="window.location.href='community-detail.html?id=${d.id}'" style="cursor:pointer;display:flex;align-items:center;justify-content:center;padding:16px;">
              ${renderShoeArt({ colors: d.colors, soleId: d.sole, materialId: d.material, decos: decosData, width: 260 })}
            </div>
            <div class="community-card-body">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                  <div class="community-card-name">${d.name}</div>
                  <div class="community-card-creator">By ${d.creator} ${d.remixOf ? '<span class="badge badge-default" style="font-size:0.625rem;">Remix</span>' : ''}</div>
                </div>
                <button class="product-card-favorite ${isUserLiked ? 'active' : ''}" onclick="toggleCommLike('${d.id}')" title="Like design" style="position:static;">
                  ${isUserLiked ? icons.heartFilled : icons.heart}
                </button>
              </div>
              <div style="font-size:0.75rem;color:var(--text-muted);margin-top:8px;">Base: ${shoeObj ? shoeObj.name : 'VAYELLE Custom'}</div>
            </div>
            <div class="community-card-footer">
              <span class="community-card-likes">${icons.heart} ${totalLikes} likes</span>
              <div style="display:flex;gap:6px;">
                <a href="remix.html?id=${d.id}" class="btn btn-accent btn-sm" style="padding:4px 12px;font-size:0.75rem;">Remix</a>
                <a href="community-detail.html?id=${d.id}" class="btn btn-outline btn-sm" style="padding:4px 10px;font-size:0.75rem;">Details</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCommLike(id) {
      toggleLike(id);
      renderCommunity();
      showToast(isLiked(id) ? 'Added to your liked showcase!' : 'Removed like', 'default');
    }

    renderCommunity();
  </script>
</body>
</html>
