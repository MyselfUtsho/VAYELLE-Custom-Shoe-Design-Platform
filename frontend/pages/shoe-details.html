<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe Details — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content">
    <div class="section-container" id="detail-page"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const shoeId = getQueryParam('id');
    const shoe = getShoe(shoeId);
    const page = document.getElementById('detail-page');

    if (!shoe) {
      page.innerHTML = '<div class="empty-state"><h3>Shoe not found</h3><a href="explore.html" class="btn btn-primary" style="margin-top:16px;">Browse Shoes</a></div>';
    } else {
      // Image view transforms
      const views = [
        { label: 'Front', transform: 'none' },
        { label: 'Mirror', transform: 'scaleX(-1)' },
        { label: 'Zoom R', transform: 'scale(1.25) translateX(-10%)' },
        { label: 'Zoom L', transform: 'scale(1.25) translateX(10%)' }
      ];
      let activeView = 0;

      function renderPage() {
        const fav = isFavorite(shoe.id);
        const otherShoes = shoes.filter(s => s.id !== shoe.id).slice(0, 3);

        page.innerHTML = `
          <nav class="breadcrumb-nav">
            <a href="../index.html">Home</a><span class="separator">/</span>
            <a href="explore.html">Explore</a><span class="separator">/</span>
            <span>${shoe.name}</span>
          </nav>

          <div class="two-col-layout" style="padding:0;">
            <!-- Image Column -->
            <div>
              <div style="border-radius:var(--radius-2xl);overflow:hidden;background:var(--stone-100);margin-bottom:16px;">
                <img id="main-image" src="../${shoe.image}" alt="${shoe.name}" style="width:100%;display:block;transition:transform 0.3s ease;transform:${views[activeView].transform};">
              </div>
              <div style="display:flex;gap:8px;">
                ${views.map((v, i) => `<button class="chip ${i === activeView ? 'active' : ''}" onclick="setView(${i})">${v.label}</button>`).join('')}
              </div>
            </div>

            <!-- Details Column -->
            <div>
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                <span class="badge badge-default">${shoe.type}</span>
                <span class="badge badge-default">${shoe.gender}</span>
                <span class="product-card-rating"><span class="star">${icons.star}</span> ${shoe.rating}</span>
              </div>
              <h1 style="margin-bottom:8px;">${shoe.name}</h1>
              <p style="font-size:1.5rem;font-weight:800;color:var(--accent);margin-bottom:16px;">${bdt(shoe.price)}</p>
              <p style="margin-bottom:24px;">${shoe.description}</p>

              <!-- Color selector -->
              <div style="margin-bottom:24px;">
                <h4 style="margin-bottom:8px;">Available Colors</h4>
                <div style="display:flex;gap:8px;">
                  ${shoe.colors.map(c => `<span class="color-swatch" style="background:${c};width:40px;height:40px;" title="${c}"></span>`).join('')}
                </div>
              </div>

              <!-- Action Buttons -->
              <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
                <button class="btn btn-accent btn-lg" onclick="selectShoe('${shoe.id}'); showToast('${shoe.name} selected!','success'); setTimeout(()=>window.location.href='materials.html',500);">Select & Customize</button>
                <button class="btn btn-outline btn-lg ${fav ? 'active' : ''}" onclick="toggleFavorite('${shoe.id}'); renderPage();" style="${fav ? 'color:var(--accent);border-color:var(--accent);' : ''}">${fav ? icons.heartFilled : icons.heart} ${fav ? 'Favorited' : 'Favorite'}</button>
              </div>

              <!-- Quick Links -->
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;">
                <a href="viewer.html" class="chip">3D Viewer</a>
                <a href="on-foot.html" class="chip">On-Foot Preview</a>
                <a href="size-guide.html" class="chip">Size Guide</a>
              </div>

              <!-- Tabs -->
              <div class="tab-nav">
                <button class="tab-btn active" onclick="showTab('desc',this)">Description</button>
                <button class="tab-btn" onclick="showTab('details',this)">Details</button>
                <button class="tab-btn" onclick="showTab('sizing',this)">Sizing</button>
              </div>
              <div class="tab-content active" id="tab-desc">
                <p>${shoe.description}</p>
                <p style="margin-top:12px;color:var(--text-muted);">Style: ${shoe.style} · Category: ${shoe.type}</p>
              </div>
              <div class="tab-content" id="tab-details">
                <ul style="list-style:none;display:flex;flex-direction:column;gap:8px;">
                  <li>• Premium quality construction</li>
                  <li>• Cushioned insole for all-day comfort</li>
                  <li>• Reinforced heel counter</li>
                  <li>• Breathable lining</li>
                  <li>• Durable outsole</li>
                </ul>
              </div>
              <div class="tab-content" id="tab-sizing">
                <p>Available in EU sizes 36–46. Check our <a href="size-guide.html" style="color:var(--accent);">size guide</a> for detailed measurements.</p>
              </div>
            </div>
          </div>

          <!-- You May Also Like -->
          <div style="margin-top:64px;">
            <h2 style="margin-bottom:24px;">You may also like</h2>
            <div class="product-grid-3">${otherShoes.map(s => renderProductCard(s, '../')).join('')}</div>
          </div>
        `;
      }

      function setView(i) {
        activeView = i;
        renderPage();
      }

      window.showTab = function(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        btn.classList.add('active');
      };

      renderPage();
      document.title = shoe.name + ' — VAYELLE';
    }
  </script>
</body>
</html>
