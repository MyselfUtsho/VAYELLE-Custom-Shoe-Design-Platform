<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content studio-theme">
    <div class="section-container">
      <div class="page-header" style="padding:0 0 24px;"><p class="eyebrow">Preview</p><h1>Live Design Preview</h1></div>

      <!-- Before / After -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:48px;" class="two-col-layout" id="preview-compare">
        <div class="studio-panel" style="padding:24px;text-align:center;">
          <h4 style="margin-bottom:12px;color:var(--stone-400);">Original Base</h4>
          <div id="original-art"></div>
        </div>
        <div class="studio-panel" style="padding:24px;text-align:center;border:2px solid var(--accent);">
          <h4 style="margin-bottom:12px;color:var(--accent);">Your Design</h4>
          <div id="custom-art"></div>
        </div>
      </div>

      <!-- Summary -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:32px;" class="product-grid-3" id="preview-summary"></div>

      <!-- Actions -->
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-accent btn-lg" onclick="saveCurrentDesign('Preview Design');showToast('Design saved!','success');">Save Design</button>
        <button class="btn studio-btn btn-lg" onclick="resetDesign();location.reload();">Reset</button>
        <a href="checkout.html" class="btn btn-primary btn-lg">Proceed to Checkout →</a>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;">
        <a href="viewer.html" class="chip" style="border-color:var(--stone-600);color:var(--stone-300);">3D Viewer</a>
        <a href="on-foot.html" class="chip" style="border-color:var(--stone-600);color:var(--stone-300);">On-Foot Preview</a>
        <a href="studio.html" class="chip" style="border-color:var(--stone-600);color:var(--stone-300);">Back to Studio</a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const design = getCurrentDesign();
    document.getElementById('original-art').innerHTML = renderShoeArt({ colors: defaultColors, width: 360 });
    document.getElementById('custom-art').innerHTML = renderShoeArt({ colors: design.colors, soleId: design.soleId, materialId: design.materialId, decos: design.decos, width: 360 });

    const parts = ['upper','toe','heel','stripe','laces','sole'];
    const shoe = design.shoeId ? getShoe(design.shoeId) : null;
    const mat = design.materialId ? getMaterial(design.materialId) : null;
    const sol = design.soleId ? getSole(design.soleId) : null;

    document.getElementById('preview-summary').innerHTML = `
      <div class="studio-panel" style="padding:20px;">
        <h4 style="margin-bottom:12px;">Colors</h4>
        ${parts.map(p => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="width:20px;height:20px;border-radius:50%;background:${design.colors[p]||'#ccc'};border:1px solid var(--stone-600);"></span>
          <span style="color:var(--stone-300);font-size:0.8125rem;">${p}: ${design.colors[p]||'—'}</span>
        </div>`).join('')}
      </div>
      <div class="studio-panel" style="padding:20px;">
        <h4 style="margin-bottom:12px;">Decorations</h4>
        ${design.decos.length === 0 ? '<p style="color:var(--stone-500);">None</p>' :
          design.decos.map(d => { const dec = getDecoration(d.id); return `<div style="color:var(--stone-300);margin-bottom:4px;font-size:0.875rem;">${dec ? dec.glyph + ' ' + dec.name : d.id}</div>`; }).join('')}
      </div>
      <div class="studio-panel" style="padding:20px;">
        <h4 style="margin-bottom:12px;">Summary</h4>
        <div style="font-size:0.875rem;color:var(--stone-400);display:flex;flex-direction:column;gap:4px;">
          <span>Shoe: ${shoe ? shoe.name : '—'}</span>
          <span>Material: ${mat ? mat.name : '—'}</span>
          <span>Sole: ${sol ? sol.name : '—'}</span>
          <span style="color:var(--accent);font-weight:700;font-size:1.125rem;margin-top:8px;">Total: ${bdt(calculatePrice())}</span>
        </div>
      </div>`;
  </script>
</body>
</html>
