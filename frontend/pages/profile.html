<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content">
    <div class="section-container" id="profile-container"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function renderProfile() {
      let user = getState().user;
      if (!user) {
        // Fallback demo user
        user = { name: 'Athoy Roy', email: 'athoy.roy@vayelle.com' };
        setUser(user);
      }

      const savedCount = getState().saved.length;
      const favCount = getState().favorites.length;
      const orderCount = getState().orders.length;
      const usualSize = getState().usualSize || 42;

      const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

      document.getElementById('profile-container').innerHTML = `
        <div class="panel" style="padding:36px;margin-bottom:32px;">
          <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
            <div class="avatar lg">${initials}</div>
            <div style="flex:1;">
              <h1 style="font-size:2rem;margin-bottom:4px;">${user.name}</h1>
              <p style="color:var(--text-muted);font-size:0.9375rem;">${user.email}</p>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <span class="badge badge-accent">VAYELLE Creator</span>
                <span class="badge badge-default">Preferred Size: EU ${usualSize}</span>
              </div>
            </div>
            <div>
              <button class="btn btn-outline btn-sm" onclick="handleSignOut()">Sign Out</button>
            </div>
          </div>
        </div>

        <!-- Quick Stats -->
        <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-bottom:36px;">
          <a href="saved.html" class="panel" style="text-align:center;text-decoration:none;transition:transform 0.2s;">
            <div style="font-size:2.25rem;font-weight:800;color:var(--text-heading);">${savedCount}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:4px;">Saved Customizations</div>
          </a>
          <a href="favorites.html" class="panel" style="text-align:center;text-decoration:none;transition:transform 0.2s;">
            <div style="font-size:2.25rem;font-weight:800;color:var(--accent);">${favCount}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:4px;">Favorited Shoes</div>
          </a>
          <a href="order-history.html" class="panel" style="text-align:center;text-decoration:none;transition:transform 0.2s;">
            <div style="font-size:2.25rem;font-weight:800;color:var(--text-heading);">${orderCount}</div>
            <div style="font-size:0.875rem;color:var(--text-muted);margin-top:4px;">Demo Orders Placed</div>
          </a>
        </div>

        <!-- Preferences & Shortcuts -->
        <div class="two-col-layout" style="padding:0;">
          <div class="panel">
            <h3 style="margin-bottom:16px;">Design Studio Settings</h3>
            <div class="checkout-line"><span class="label">Shoe Sizing Profile:</span><span class="value">EU ${usualSize}</span></div>
            <div class="checkout-line"><span class="label">Color Blind Mode:</span><span class="value"><a href="accessible.html" style="color:var(--accent);">Accessible Options</a></span></div>
            <div class="checkout-line"><span class="label">Outfit Profile:</span><span class="value">${getState().outfit ? 'Active Outfit Uploaded' : 'None'}</span></div>
            <div style="margin-top:16px;">
              <a href="size-guide.html" class="btn btn-outline btn-sm">Calibrate Shoe Size</a>
              <a href="outfit-upload.html" class="btn btn-outline btn-sm" style="margin-left:8px;">Update Outfit</a>
            </div>
          </div>

          <div class="panel">
            <h3 style="margin-bottom:16px;">Quick Studio Actions</h3>
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:16px;">Pick up right where you left off or start a fresh silhouette customization.</p>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <a href="studio.html" class="btn btn-accent">Open Studio Canvas</a>
              <a href="saved.html" class="btn btn-outline">My Saved Designs</a>
            </div>
          </div>
        </div>
      `;
    }

    function handleSignOut() {
      logoutUser();
      showToast('Signed out of session', 'default');
      setTimeout(() => { window.location.href = 'login.html'; }, 400);
    }

    renderProfile();
  </script>
</body>
</html>
