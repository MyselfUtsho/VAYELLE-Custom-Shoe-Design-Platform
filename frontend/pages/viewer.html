<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer — VAYELLE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="main-content">
    <div class="section-container">
      <div class="page-header" style="padding:0 0 24px;"><p class="eyebrow">3D</p><h1>Shoe Viewer</h1><p>Rotate and zoom to explore your design from every angle.</p></div>
      <!-- Viewer Area -->
      <div style="background:var(--stone-100);border-radius:var(--radius-2xl);min-height:480px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:24px;" id="viewer-area"></div>

      <!-- Controls -->
      <div style="display:flex;justify-content:center;gap:12px;margin-bottom:16px;">
        <button class="btn btn-outline" onclick="rotateView(-30)">← Rotate Left</button>
        <button class="btn btn-outline" onclick="rotateView(30)">Rotate Right →</button>
        <button class="btn btn-outline" onclick="zoomView(0.15)">+ Zoom In</button>
        <button class="btn btn-outline" onclick="zoomView(-0.15)">− Zoom Out</button>
        <button class="btn btn-outline" onclick="resetView()">Reset</button>
      </div>
      <div style="display:flex;justify-content:center;gap:8px;margin-bottom:32px;">
        <button class="chip" onclick="setAngle(0)">Side View</button>
        <button class="chip" onclick="setAngle(45)">Front ¾</button>
        <button class="chip" onclick="setAngle(-45)">Back ¾</button>
        <button class="chip" onclick="setAngle(180)">Mirror</button>
      </div>

      <div class="panel" style="text-align:center;padding:16px;margin-bottom:24px;">
        <p style="color:var(--text-muted);font-size:0.875rem;">⚠ This is a CSS-transform simulation. Full 3D models using Three.js will arrive with our backend release.</p>
      </div>

      <div style="display:flex;gap:12px;justify-content:center;">
        <a href="on-foot.html" class="btn btn-outline">On-Foot Preview</a>
        <a href="preview.html" class="btn btn-outline">Live Preview</a>
        <a href="studio.html" class="btn btn-accent">Back to Studio</a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let rotation = 0;
    let zoom = 1;

    function render3D() {
      const design = getCurrentDesign();
      document.getElementById('viewer-area').innerHTML = `<div style="transform:perspective(900px) rotateY(${rotation}deg) scale(${zoom});transition:transform 0.4s ease;">
        ${renderShoeArt({ colors: design.colors, soleId: design.soleId, materialId: design.materialId, decos: design.decos, width: 500 })}
      </div>`;
    }

    function rotateView(deg) { rotation += deg; render3D(); }
    function zoomView(delta) { zoom = Math.max(0.5, Math.min(2.5, zoom + delta)); render3D(); }
    function setAngle(deg) { rotation = deg; render3D(); }
    function resetView() { rotation = 0; zoom = 1; render3D(); }

    render3D();
  </script>
</body>
</html>
